<svg class="plan" viewBox="50 0 560 322" role="img" aria-labelledby="plan-title plan-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="plan-title">Ground floor of the East Midlands Conference Centre</title>
  <desc id="plan-desc">Simplified plan, not to scale. The entrance and reception are on the right. Main Room 1 and Main Room 2 sit side by side on the left. Conference Room 1 and Conference Room 2 are along the top, off the concourse. The prayer room and toilets are in the middle, beside the Conference Theatre.</desc>

  <!-- public concourse -->
  <path class="plan-public" d="M235 22 H500 V62 H566 V104 C598 128 606 160 600 178 C604 208 574 240 500 250 V312 H235 Z"/>

  <!-- staff-only areas -->
  <rect class="plan-staff" x="60" y="10" width="175" height="68"/>
  <rect class="plan-staff" x="60" y="248" width="175" height="55"/>
  <rect class="plan-staff" x="360" y="26" width="38" height="50"/>

  <!-- other rooms -->
  <rect class="plan-other" x="300" y="143" width="162" height="112"/>
  <rect class="plan-line" x="262" y="275" width="90" height="36"/>
  <rect class="plan-line" x="405" y="275" width="90" height="36"/>

  <!-- our rooms -->
  <rect class="plan-main" x="60" y="78" width="175" height="85"/>
  <rect class="plan-main" x="60" y="163" width="175" height="85"/>
  <line class="plan-divider" x1="60" y1="163" x2="235" y2="163"/>
  <rect class="plan-conf" x="405" y="33" width="90" height="42"/>
  <rect class="plan-conf" x="262" y="33" width="90" height="42"/>

  <!-- facilities -->
  <rect class="plan-facility" x="240" y="222" width="52" height="42"/>
  <rect class="plan-facility" x="242" y="143" width="40" height="62"/>
  <rect class="plan-facility" x="512" y="252" width="40" height="36"/>
  <rect class="plan-facility" x="506" y="64" width="58" height="38"/>

  <!-- number and letter keys -->
  <g class="plan-key plan-key-main">
    <rect x="132" y="190" width="31" height="31"/><text x="147.5" y="213">1</text>
    <rect x="132" y="105" width="31" height="31"/><text x="147.5" y="128">2</text>
  </g>
  <g class="plan-key plan-key-conf">
    <rect x="434.5" y="38.5" width="31" height="31"/><text x="450" y="61.5">3</text>
    <rect x="291.5" y="38.5" width="31" height="31"/><text x="307" y="61.5">4</text>
  </g>
  <g class="plan-letter">
    <text x="266" y="251">P</text>
    <text x="262" y="182">T</text>
    <text x="532" y="278">T</text>
    <text x="535" y="91">E</text>
  </g>

  <!-- labels shown on wider screens -->
  <g class="plan-label">
    <text x="147.5" y="240">Main Room 1</text>
    <text x="147.5" y="155">Main Room 2</text>
    <text x="381" y="203">Conference Theatre</text>
    <text x="368" y="112">Concourse</text>
    <text x="545" y="180">Atrium</text>
    <text x="307" y="297">Conference Suite 3</text>
    <text x="450" y="297">Conference Suite 4</text>
    <text x="147.5" y="48" class="plan-label-quiet">Staff only</text>
    <text x="147.5" y="280" class="plan-label-quiet">Staff only</text>
  </g>

  <!-- way in -->
  <g class="plan-arrow">
    <line x1="585" y1="40" x2="566" y2="58"/>
    <path d="M560 64 L563 51 L573 61 Z"/>
  </g>
</svg>
